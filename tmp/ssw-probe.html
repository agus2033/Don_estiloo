<!-- Verificación real del SquishSwitch (lote 45): marca EXACTA de
     index.html + styles.css real + el módulo src/ssw.js REAL (no copia).
     El caller replica el de main.js (dataset.theme + localStorage). -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css">
<style>body{margin:24px;background:#141c26;display:flex;gap:10px;align-items:center}</style>
</head><body>
<button id="thm" type="button" role="switch" aria-checked="false" aria-label="Cambiar tema claro oscuro">
  <span class="ssw-kn">
    <svg class="ssw-ico ssw-ico--luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 14.2A8.9 8.9 0 0 1 9.8 3.4 9 9 0 1 0 20.6 14.2Z" fill="currentColor"/></svg>
    <svg class="ssw-ico ssw-ico--sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.3" y1="5.3" x2="7.2" y2="7.2"/><line x1="16.8" y1="16.8" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="7.2" y2="16.8"/><line x1="16.8" y1="7.2" x2="18.7" y2="5.3"/></g></svg>
  </span>
</button>
<script type="module">
import { sswMontar } from "../src/ssw.js";
const btn = document.getElementById("thm");
const ssw = sswMontar(btn, {
  inicial: false,
  onChange: (claro) => { claro ? localStorage.setItem("theme", "light") : localStorage.setItem("theme", ""); },
});
window.__ssw = ssw;
</script>
</body></html>
