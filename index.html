<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Codigo Barber · Turnos y puntos</title>
    <!-- El título y la descripción siguen a NOMBRE (src/config.js): cambialos
         juntos cuando se defina el nombre de la marca. -->
    <meta
      name="description"
      content="Reservá tu turno de barbería online, sumá 5 puntos por cada corte y canjealos por descuentos y cortes gratis."
    />
    <meta name="theme-color" content="#141c26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />

    <!-- Compartir por WhatsApp / Instagram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codigo Barber" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Tu turno, sin vueltas. Reservá online." />
    <meta
      property="og:description"
      content="Reservá tu turno de barbería online, sumá puntos por cada corte y canjealos por descuentos y cortes gratis."
    />
    <meta property="og:image" content="https://don-estilo.vercel.app/assets/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tu turno, sin vueltas. Reservá online." />
    <meta
      name="twitter:description"
      content="Reservá online y sumá puntos por cada corte."
    />
    <meta name="twitter:image" content="https://don-estilo.vercel.app/assets/icon-512.png" />

    <!-- Las fuentes son el recurso de terceros más pesado del arranque -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- CSP (opcional): ahora que no hay onclick= ni scripts en línea se puede activar. Probala primero con la consola abierta.
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://www.google.com https://*.firebaseapp.com; base-uri 'self'; form-action 'self'; object-src 'none'" />
    -->
    <link rel="stylesheet" href="src/styles.css?v=3" />
    <link rel="stylesheet" href="src/landing.css?v=1" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#141c26" />
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="ld" role="status" aria-live="polite">
      <div class="bp"><i></i></div>
      <span id="ldt">Cargando…</span>
    </div>
    <header>
      <div class="hd">
        <div class="bw"><img id="lg" class="lg" alt="" width="38" height="38" /><span class="logo" id="brand"></span></div>
        <nav id="nav"></nav>
        <button id="hamb" data-act="toggleNav" aria-label="Menú" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div id="mebadge" hidden>
          <span id="mefn"></span>
          <span class="med" id="med"></span>
        </div>
        <button id="thm" aria-label="Cambiar tema claro oscuro">☀︎</button>
        <button id="lo" hidden data-act="salir" aria-label="Cerrar sesión">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" /></svg
          ><span>Cerrar sesión</span>
        </button>
      </div>
    </header>
    <div id="app"></div>
    <div id="nmenu" hidden></div>
    <div id="wzm" hidden></div>
    <footer id="ft"></footer>
    <div id="mo" hidden></div>
    <div id="po" hidden></div>
    <script type="module" src="src/main.js"></script>
    <script src="src/boot.js"></script>
  </body>
</html>
