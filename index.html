<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- ===================== SEO LOCAL =====================
         Todo lo de esta sección tiene que coincidir con `DOMINIO`, `CP`,
         `LAT`, `LON`, `CALLE`, `CIUDAD`, `PROVINCIA`, `S`, `MP` y
         `HORARIO_GENERAL` de src/config.js. Son dos lugares porque index.html
         es estático y Google tiene que leerlo sin ejecutar JavaScript:
         `tests\seo.js` compara los dos y falla si se separan.

         El dominio también aparece en robots.txt y en sitemap.xml. Son cinco
         lugares en total. Si cambia el dominio, se cambian los cinco. -->

    <title>Codigo Barber | Barbería en Puerto Iguazú, Misiones</title>
    
  <!-- NO va una CSP en <meta>. La de verdad la manda vercel.json y la copia
       de desarrollo la manda tests/srv.js, y tests/csp.sync.js verifica que
       sean id�nticas. Cuando hay dos (una en el cabecera y otra ac�), el
       navegador aplica LA M�S RESTRICTIVA de las dos: la del <meta> s�lo
       dec�a script-src, as� que hoy no romp�a nada, pero cualquier cosa que se
      tocara en un lado y no en el otro rompe en producci�n sin que nadie lo
       note. Una sola fuente. -->  
    <meta
      name="description"
      content="Codigo Barber, barbería en Puerto Iguazú, Misiones. Corte de pelo, perfilado de barba y corte + barba. Reservá tu turno online por WhatsApp."
    />
    <link rel="canonical" href="https://codigobarber.com.ar/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Señales de ubicación para buscadores. Complementan al JSON-LD: Google
         las usa para mostrar el nombre y el teléfono junto al resultado.
         OJO con los dos formatos, que son distintos y se confunden:
         geo.position va "latitud;longitud" (punto y coma) e ICBM va
         "latitud,longitud" (coma). -->
    <meta name="geo.region" content="AR-M" />
    <meta name="geo.placename" content="Puerto Iguazú, Misiones" />
    <meta name="geo.position" content="-25.618;-54.5701752" />
    <meta name="ICBM" content="-25.618, -54.5701752" />
    <meta name="author" content="Codigo Barber" />
    <meta name="theme-color" content="#141c26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />

    <!-- Compartir por WhatsApp / Instagram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codigo Barber" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Codigo Barber - Barbería en Puerto Iguazú" />
    <meta
      property="og:description"
      content="Codigo Barber, barbería en Puerto Iguazú, Misiones. Corte de pelo, perfilado de barba y corte + barba. Reservá tu turno online por WhatsApp."
    />
    <meta property="og:url" content="https://codigobarber.com.ar/" />
    <meta property="og:image" content="https://codigobarber.com.ar/assets/logo-256.png" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta property="og:image:alt" content="Codigo Barber, barbería en Puerto Iguazú" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Codigo Barber - Barbería en Puerto Iguazú" />
    <meta
      name="twitter:description"
      content="Codigo Barber, barbería en Puerto Iguazú, Misiones. Corte de pelo, perfilado de barba y corte + barba. Reservá tu turno online por WhatsApp."
    />
    <meta name="twitter:image" content="https://codigobarber.com.ar/assets/logo-256.png" />

    <!-- ============ DATOS ESTRUCTURADOS (Schema.org / BarberShop) ============
         BarberShop es el tipo correcto: hereda de HairSalon y de LocalBusiness,
         así que Google lo usa para el paquete de información local (nombre,
         mapa, teléfono, horarios y reseñas).

         Cuatro correcciones sobre el JSON que se pasó. Como estaba, Google lo
         ignoraba o mostraba el local en el lugar equivocado:
           1. "streetAddress" decía "Puerto Iguazú", que es la CIUDAD, no la
              calle. Con la ciudad repetida en el campo de calle, Google no
              lograba ubicar el negocio en el mapa.
           2. "openingHoursSpecification" era un objeto suelto. Schema.org la
              declara como propiedad repetida y Google la espera como ARREGLO.
           3. "image" apuntaba a "/logo.png", que no existe: el logo está en
              assets/logo-256.png.
           4. El teléfono +543757000000 no es de nadie. Van los dos WhatsApp
              reales del local. NO hay fijo, así que no se inventa uno: un
              teléfono falso en el JSON-LD es lo peor que se puede hacer en
              SEO local, porque Google lo contrasta contra Maps y contra las
              reseñas y te desalinea el negocio. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarberShop",
        "@id": "https://codigobarber.com.ar/#negocio",
        "name": "Codigo Barber",
        "description": "Barbería en Puerto Iguazú, Misiones. Corte de pelo, perfilado de barba y corte + barba, con reserva de turno online.",
        "url": "https://codigobarber.com.ar/",
        "image": ["https://codigobarber.com.ar/assets/logo-256.png"],
        "logo": "https://codigobarber.com.ar/assets/logo-256.png",
        "telephone": "+5493757699335",
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "telephone": "+5493757699335",
            "areaServed": "AR",
            "availableLanguage": ["es"]
          },
          {
            "@type": "ContactPoint",
            "contactType": "reservations",
            "telephone": "+5493757644751",
            "url": "https://wa.me/5493757699335",
            "areaServed": "AR",
            "availableLanguage": ["es"]
          }
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Su Santidad y Papa Francisco",
          "addressLocality": "Puerto Iguazú",
          "addressRegion": "Misiones",
          "postalCode": "3370",
          "addressCountry": "AR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -25.618,
          "longitude": -54.5701752
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "https://schema.org/Monday",
              "https://schema.org/Tuesday",
              "https://schema.org/Wednesday",
              "https://schema.org/Thursday",
              "https://schema.org/Friday",
              "https://schema.org/Saturday"
            ],
            "opens": "09:00",
            "closes": "17:00"
          }
        ],
        "priceRange": "$$",
        "currenciesAccepted": "ARS",
        "paymentAccepted": "Efectivo, Transferencia",
        "areaServed": {
          "@type": "City",
          "name": "Puerto Iguazú",
          "containedInPlace": { "@type": "State", "name": "Misiones" }
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios",
          "itemListElement": [
            {
              "@type": "Offer",
              "priceCurrency": "ARS",
              "price": "15000",
              "itemOffered": {
                "@type": "Service",
                "name": "Corte (Incluye cejas)",
                "description": "Corte de pelo con perfilado de cejas, 30 minutos."
              }
            },
            {
              "@type": "Offer",
              "priceCurrency": "ARS",
              "price": "8000",
              "itemOffered": { "@type": "Service", "name": "Barba", "description": "Perfilado de barba, 30 minutos." }
            },
            {
              "@type": "Offer",
              "priceCurrency": "ARS",
              "price": "20000",
              "itemOffered": { "@type": "Service", "name": "Corte + barba", "description": "Corte de pelo y perfilado de barba, 60 minutos." }
            }
          ]
        },
        "sameAs": ["https://www.instagram.com/codigobarber_1"]
      }
    </script>
    <!-- aggregateRating NO va hasta que haya reseñas REALES y públicas en la
         web: Google penaliza el puntaje inventado. Hoy en Firestore hay 13
         reseñas de las cuales 10 son de prueba. Cuando estén limpias, este
         bloque se arma desde Firestore (ver CONTINUAR.md, sección 17). -->

    <!-- Las fuentes son el recurso de terceros más pesado del arranque -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- La CSP ya NO va como <meta> en el HTML: ahora la manda la cabecera del
         servidor (vercel.json), que es lo único que cubre también las
         peticiones que no pasan por este documento (el service worker, los
         módulos de Firebase, las fuentes).

         Ojo con esto: las dos se aplican a la vez si existen las dos, y el
         navegador se queda con la más restrictiva. Con el <meta> viejo, la
         web perdía las tipografías de Google porque ese <meta> no incluía
         fonts.googleapis.com en style-src. Para cambiarla ahora hay que editar
         vercel.json Y tests/srv.js (que manda la misma cadena para poder
         probarla en local), y después correr `node tests/csp.js`. -->
    <link rel="stylesheet" href="src/styles.css?v=3" />
    <link rel="stylesheet" href="src/landing.css?v=1" />
    <link rel="manifest" href="manifest.json" />
    <!-- Este theme-color SIN media estaba acá y pisaba a los dos de arriba,
         que sí lo tienen: en el modo claro la barra del navegador salía
         azul oscuro en vez de marfil. Los dos de arriba (con media) son los
         que quedan. -->
    <!-- El favicon. va PRIMERO y sin `sizes`: es la ruta que el buscador pide
         cuando todavía no cacheó nada, y era la que faltaba (no había ningún
         favicon.ico en la raíz), por eso Google mostraba el globo genérico al
         lado del nombre. El PNG de 192 sigue después para los que lo prefieren.
         `tests\seo.js` comprueba que el archivo exista y que sea un .ico real. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="16x16" />
    <link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="ld" role="status" aria-live="polite">
      <!--
        El logo va con `src` fijo en el HTML y NO asignado desde main.js como
        el del header (`#lg`, que sí lo pone `LOGO` de config.js): el loader
        se muestra ANTES de que cargue el módulo, y si el src llegara por JS
        el primer segundo se vería un disco vacío. El precio de hardcodear la
        ruta es que puede desincronizarse de `LOGO` en config.js, así que
        `tests\loader.js` compara las dos y falla si se separan.

        Esta imagen es la capa de ABAJO: el escudo entero, apagado. Encima, en
        CSS, `.lgc::before` pone la MISMA imagen como fondo y esa sí se revela
        de arriba hacia abajo. Al ser la misma URL no hay una segunda descarga.
        `--ld-logo` en styles.css también tiene que coincidir: el test lo
        verifica.
      -->
      <span class="lgc">
        <img class="lgl" src="assets/logo-256.png" alt="" width="176" height="176" />
      </span>
      <span id="ldt">Cargando…</span>
    </div>
    <header>
      <div class="hd">
        <div class="bw"><img id="lg" class="lg" alt="" width="38" height="38" /><span class="logo" id="brand"></span></div>
        <nav id="nav"></nav>
        <!-- La foto ES el botón del menú: no hay un hamburguesa al lado.
             Antes el admin tenía su propio #hamb y el cliente un #perfil
             aparte; ahora los dos menús salen de acá. Para el cliente abre
             #pmenu, para el admin el #nmenu de siempre.
             El #pmenu va dentro de este wrapper y no del <button>: un
             <div> dentro de un <button> es HTML inválido. El wrapper es
             el que lleva position:relative, así el menú se ancla a la
             foto en vez de flotar pegado a una esquina de la ventana. -->
        <!-- Orden pedido por el dueño: CASITA, TOGGLE, FOTO. El mismo en
             celular y en escritorio. Antes la foto venía antes del toggle y
             "Cerrar sesión" era un botón suelto que apretaba la fila. -->
        <div class="hd-der">
          <!-- La casita ES el botón de "Ver la web": mismo ícono, mismo
               data-act, pero sin el texto al lado. El texto ocupaba media
               fila y en celular empujaba todo. -->
          <button id="web" hidden data-act="verWebOn" aria-label="Ver la página de la barbería">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 11l9-8 9 8" />
              <path d="M5 10v10h14V10" /></svg
            >
          </button>
          <button id="thm" aria-label="Cambiar tema claro oscuro">☀︎</button>
          <!-- La foto ES el botón del menú: no hay un hamburguesa al lado.
               El #pmenu va dentro de este wrapper y no del <button>: un
               <div> dentro de un <button> es HTML inválido. El wrapper es
               el que lleva position:relative, así el menú se ancla a la
               foto en vez de flotar pegado a una esquina de la ventana. -->
          <div class="mewrap">
            <button id="mebadge" data-act="toggleMebadge" aria-label="Menú de tu perfil" aria-expanded="false" aria-controls="pmenu" hidden>
              <span id="mefn"></span>
              <span class="med" id="med"></span>
            </button>
            <div id="pmenu" hidden></div>
          </div>
        </div>      </div>
      <!-- La bandeja con las secciones que NO entran en la barra de celular.
           Antes este mismo #nmenu era el menú de la foto del admin; ahora
           lo abre el botón de tres rayitas de la barra de abajo. Por eso
           vive acá, fuera de .hd: se ancla a la barra, no al encabezado. -->
      <div id="nmenu" hidden></div>
    </header>
    <div id="app"></div>
    <div id="wzm" hidden></div>
    <footer id="ft"></footer>
    <div id="mo" hidden></div>
    <div id="po" hidden></div>
    <script type="module" src="src/main.js"></script>
    <script src="src/boot.js"></script>
  </body>
</html>
