<?xml version="1.0" encoding="UTF-8"?>
<!--
  Instagram. Mismo motivo que el de WhatsApp: el anterior venía de
  CorelDRAW con un viewBox de 70000x70000 y coordenadas enormes, legible
  sólo en tamaños grandes. Este usa coordenadas normales (24x24) y el
  degradado va en un <defs>, así el archivo es chico y se ve nítido a los
  18-20 px en que se usa.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="igGrad" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEDA75"/>
      <stop offset="0.28" stop-color="#FA7E1E"/>
      <stop offset="0.62" stop-color="#D62976"/>
      <stop offset="1" stop-color="#962FBF"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#igGrad)"/>
  <g fill="none" stroke="#fff" stroke-width="1.9">
    <rect x="6.9" y="6.9" width="10.2" height="10.2" rx="3"/>
    <circle cx="12" cy="12" r="2.6"/>
  </g>
  <circle cx="15.4" cy="8.6" r="1.1" fill="#fff"/>
</svg>